# nginx для мини-аппа «Спросить ОКО».
# __DOMAIN__ подставляет deploy/setup-web.sh, HTTPS доводит certbot --nginx.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Telegram открывает мини-апп только по HTTPS
    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ответ чата идёт потоком (Server-Sent Events): буферизация его ломает,
        # а ответ модели может собираться дольше минуты.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    client_max_body_size 1m;
}
